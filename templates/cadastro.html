
{% extends 'base.html' %}

{% block titulo %}Cadastro | StudyFlow{% endblock %}

{% block conteudo %}


<div class="barra-titulo-linha">
    <span>Criar conta</span>
</div>

<section class="painel formulario">
    <h2>Cadastre-se no StudyFlow</h2>
    <p>Crie sua conta para organizar seus estudos.</p>

    <form method="POST" action="{{ url_for('cadastro') }}">

        <div class="campo">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" required placeholder="Digite seu nome completo">
        </div>

        <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required placeholder="Digite seu e-mail">
        </div>

        <div class="campo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required placeholder="Crie uma senha">
        </div>

        <div class="campo">
            <label for="confirmar_senha">Confirmar senha</label>
            <input type="password" id="confirmar_senha" name="confirmar_senha" required placeholder="Digite a senha novamente">
        </div>

        <div class="acoes-formulario">
            <button type="submit" class="botao">Criar conta</button>
        </div>

    </form>
</section>
{% endblock %}
